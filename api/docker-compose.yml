services:
  postgres:
    image: postgres:16
    container_name: projectpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: projectpulse
      POSTGRES_USER: projectpulse
      POSTGRES_PASSWORD: projectpulse
    ports:
      - '5432:5432'
    volumes:
      - projectpulse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U projectpulse -d projectpulse']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  projectpulse-postgres:
    driver: local
